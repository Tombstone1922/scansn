name: Android Release CD

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
      - "RELEASE_NOTES.md"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, например v1.2.1"
        required: true
        type: string
        default: "v1.2.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scansn-release.p12"

      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/scansn-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifacts and OTA manifest
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            APP_VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
            TAG_NAME="v$APP_VERSION"
          else
            TAG_NAME="$REF_NAME"
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.1" >&2
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          APP_VERSION="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $VERSION does not match app version $APP_VERSION" >&2
            exit 1
          fi
          APK_NAME="ScanSN-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          printf '%s  %s\n' "$SHA256" "$APK_NAME" > checksums.txt
          cat > latest.json <<EOF
          {
            "packageName": "com.tombstone.scansn",
            "versionName": "$VERSION",
            "versionCode": $VERSION_CODE,
            "releaseTag": "$TAG_NAME",
            "apkFile": "$APK_NAME",
            "apkUrl": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/$APK_NAME",
            "sha256": "$SHA256",
            "minimumSdk": 26
          }
          EOF
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ScanSN ${{ steps.version.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.version.outputs.apk }}
            latest.json
            checksums.txt
          generate_release_notes: false
