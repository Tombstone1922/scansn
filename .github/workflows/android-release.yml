name: Android Release CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scansn-release.p12"

      - name: Test and build signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/scansn-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifacts and OTA manifest
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${TAG_NAME#v}"
          APK_NAME="ScanSN-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$VERSION_CODE" ]; then
            echo "Could not read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          printf '%s  %s\n' "$SHA256" "$APK_NAME" > checksums.txt
          cat > latest.json <<EOF
          {
            "packageName": "com.tombstone.scansn",
            "versionName": "$VERSION",
            "versionCode": $VERSION_CODE,
            "releaseTag": "$TAG_NAME",
            "apkFile": "$APK_NAME",
            "apkUrl": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/$APK_NAME",
            "sha256": "$SHA256",
            "minimumSdk": 26
          }
          EOF
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ScanSN ${{ steps.version.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            ScanSN-${{ github.ref_name }}.apk
            latest.json
            checksums.txt
          generate_release_notes: false
